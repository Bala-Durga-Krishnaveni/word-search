<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Science with Python - Word Search Challenge</title>
<style>:root{--blue:#3B82F6;--purple:#8B5CF6;--green:#10B981;--orange:#F59E0B;--pink:#EC4899;--bg:#F5F7FB;--card:#FFFFFF;--text:#1F2430;--muted:#6B7280;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.hidden{display:none!important}#app{max-width:1100px;margin:0 auto;padding:16px}.topbar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--purple),var(--blue));color:#fff;padding:14px 20px;border-radius:16px;margin-bottom:16px;flex-wrap:wrap;gap:8px}.topbar h1{font-size:18px;margin:0;font-weight:700}.topbar .student{font-size:14px;opacity:.95;background:#ffffff2e;padding:6px 12px;border-radius:20px}.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px #1414280f;margin-bottom:16px}#nameScreen{max-width:420px;margin:60px auto;text-align:center}#nameScreen h2{margin-top:0}#nameScreen input{width:100%;padding:12px 14px;border-radius:10px;border:2px solid #E2E8F0;font-size:16px;margin:14px 0}.btn{cursor:pointer;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;background:var(--blue);transition:transform .12s ease}.btn:hover{transform:translateY(-1px)}.btn.green{background:var(--green)}.btn.purple{background:var(--purple)}.btn.orange{background:var(--orange)}.btn.outline{background:#fff;color:var(--blue);border:2px solid var(--blue)}.err{color:#dc2626;font-size:13px;min-height:18px}.dash{display:grid;grid-template-columns:220px 1fr;gap:16px}@media(max-width:760px){.dash{grid-template-columns:1fr}}.unitList{display:flex;flex-direction:column;gap:8px}.unitBtn{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #E5E7EB;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--text)}.unitBtn small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}.unitBtn.active{border-color:var(--purple);background:#f3eeff}.unitColors{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.puzzleWrap{display:grid;grid-template-columns:1fr 240px;gap:16px}.puzzleWrap>div{min-width:0}@media(max-width:760px){.puzzleWrap{grid-template-columns:1fr}}.puzzleHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}.statPill{background:#f1f5f9;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text)}.statsRow{display:flex;gap:8px;flex-wrap:wrap}.gridBox{display:flex;justify-content:center;overflow-x:auto}.gridWrap{position:relative;display:inline-block}#pathSvg{position:absolute;top:0;left:0;z-index:0;pointer-events:none}#grid{position:relative;z-index:1;display:grid;user-select:none;touch-action:none}.cell{width:var(--cell,36px);height:var(--cell,36px);border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell,36px)*.42);font-weight:700;cursor:pointer;color:var(--text);transition:background .1s;border:2px solid transparent}.cell.sel{background:#fde68a}.cell.wordFound{color:#fff;background:transparent;text-shadow:0 1px 2px rgba(0,0,0,.35)}.cell.startHint{color:#fff;font-weight:800}.cell.hint{outline:3px solid #F59E0B}#pathSvg{overflow:visible}.cell.empty{background:transparent;cursor:default;pointer-events:none}.cell.spare{background:#fffbeb;border:2px dashed #FCD34D;color:#f59e0b;cursor:default;pointer-events:none;font-size:calc(var(--cell,36px)*.5)}.kwPanel h3{margin:4px 0 10px;font-size:15px}.kwList{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}.kwItem{font-size:13px;padding:7px 10px;border-radius:8px;background:#f8fafc;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}.kwItem .dot{width:10px;height:10px;border-radius:50%;background:#e2e8f0;flex-shrink:0}.kwItem .blank{font-family:monospace;letter-spacing:2px}.kwItem.found{color:#fff;font-weight:700}.controlsRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.overlay{position:fixed;inset:0;background:#00000080;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modalCard{background:#fff;border-radius:18px;padding:28px;max-width:380px;width:100%;text-align:center}.modalCard h2{margin-top:0;font-size:22px}.modalStats{text-align:left;background:#f8fafc;border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8}.modalBtns{display:flex;flex-direction:column;gap:8px}table.lb{width:100%;border-collapse:collapse;font-size:13px}table.lb th{text-align:left;padding:8px;color:var(--muted);border-bottom:2px solid #E5E7EB;font-size:12px}table.lb td{padding:8px;border-bottom:1px solid #F1F5F9}.you{background:#eff6ff}.ribbon{stroke-dasharray:var(--len);animation:ribbonDraw .55s ease-out both}.ribbonDash{animation:ribbonFade .7s .35s ease-out both}@keyframes ribbonDraw{0%{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}@keyframes ribbonFade{0%{opacity:0}to{opacity:.6}}#nameScreen input+input{margin-top:10px}.fine{color:var(--muted);font-size:12px;margin:12px 0 0;text-align:center}.student .switch{margin-left:8px;border:0;background:#ffffff40;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;cursor:pointer}.saveStatus{margin:12px 0 4px;padding:8px 12px;border-radius:10px;font-size:13px;background:#f3f4f6;color:#374151}.saveStatus.shared{background:#d1fae5;color:#065f46}.saveStatus.queued,.saveStatus.error{background:#fef3c7;color:#92400e}.lbMode{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:10px}.lbMode.shared{background:#d1fae5;color:#065f46}.lbMode.local{background:#fef3c7;color:#92400e}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.tab{border:2px solid #E5E7EB;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font- <div id="root"><p id="boot" style="font-family:sans-serif;color:#6B7280;text-align:center;margin-top:80px">Loading word search&hellip;</p></div>
<script>
/* ===== SETTINGS - edit these two lines ===================================
   scoreApiUrl   : paste your Google Apps Script web-app URL here (ends with /exec).
                   Leave it empty to keep scores on each device only.
   requireRollNo : true = students must type a roll number
   ======================================================================== */
window.WORDSEARCH_CONFIG = {
  scoreApiUrl: "https://script.google.com/macros/s/AKfycbzl0ibbtzUCm-yrchOkzWw2l6WWxsjG7O24WFxzXiutWRkAK9nwYqNiGE3OT6fO4Fqu/exec",
  requireRollNo: false
};
</script>
<noscript><p style="font-family:sans-serif;text-align:center;margin-top:80px">This puzzle needs JavaScript. Please enable it in your browser.</p></noscript>
<script>
/* If the app cannot start, say why instead of leaving a blank page. */
(function () {
  function fail(msg) {
    var r = document.getElementById('root');
    if (!r || !document.getElementById('boot')) return;
    r.innerHTML = '<div style="font-family:sans-serif;max-width:480px;margin:60px auto;padding:20px;border:2px solid #FCA5A5;border-radius:12px;background:#FEF2F2;color:#7F1D1D">' +
      '<b>The puzzle could not start.</b><p style="font-size:14px">Please open this file in an up-to-date Chrome, Edge, Firefox or Safari, and make sure the whole file was copied or uploaded.</p>' +
      '<p style="font-size:12px;color:#991B1B">Details: ' + String(msg).replace(/</g, '&lt;') + '</p></div>';
  }
  window.addEventListener('error', function (e) { fail(e.message || 'script error'); });
  setTimeout(function () { fail('the app did not load (script blocked or incomplete)'); }, 4000);
})();
</script>
